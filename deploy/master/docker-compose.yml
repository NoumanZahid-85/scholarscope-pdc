# EC2 MASTER node. Same image (pinned by digest) on all 3 nodes; only ROLE differs. Start: docker compose up -d
services:
  scholar:
    image: noumandockeruser65/pdc-scholar@sha256:785c953248ef74a6abee448d1bcb4cb9b120cd5bf7d2789ab55af8aa2a6ee081
    container_name: scholar
    network_mode: host                                     # MPI/ssh use the node's own IP; EC2 metadata reachable
    restart: unless-stopped                                # back after the instance is stopped and started
    environment:
      ROLE: master
      IMAGE_DIGEST: sha256:785c953248ef74a6abee448d1bcb4cb9b120cd5bf7d2789ab55af8aa2a6ee081
      # MPI over the VPC network only (not docker0); 172.31.0.0/16 = the default VPC
      MPIRUN_ARGS: "--mca btl_tcp_if_include 172.31.0.0/16 --mca oob_tcp_if_include 172.31.0.0/16"
    volumes:
      - /data:/data
      - /home/ubuntu/mpi-ssh:/home/mpiuser/.ssh
